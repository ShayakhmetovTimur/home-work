<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - EQUIP</title>
    <link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="logo">
                <a href="../index.html">
                    <img src="../assets/images/logo.png" alt="EQUIP" height="40">
                </a>
            </div>
            <nav class="main-nav">
                <a href="catalog.html">новинки</a>
                <a href="catalog.html">категории</a>
                <a href="sale.html">SALE</a>
            </nav>
            <div class="header-icons">
                <a href="#" class="icon-link">♡ <span class="count">0</span></a>
                <a href="#" class="icon-link">🛒 <span class="count">0</span></a>
                <a href="login.html" class="icon-link"></a>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="form-container">
            <h2>Регистрация</h2>
            <form>
                <div class="form-group">
                    <label>Имя</label>
                    <input type="text" class="form-input" placeholder="Иван">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-input" placeholder="hello@example.com">
                </div>
                <div class="form-group">
                    <label>Телефон</label>
                    <input type="tel" class="form-input" placeholder="+7 (___) ___-__-__">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" class="form-input" placeholder="••••••••">
                </div>
                <button type="submit" class="btn full-width-btn">Зарегистрироваться</button>
                <p style="margin-top: 20px; text-align: center; color: #666;">
                    Уже есть аккаунт? <a href="login.html" style="color: #708090; font-weight: bold; text-decoration: underline;">Войти</a>
                </p>
            </form>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-content">
            <div class="footer-col">
                <h3>EQUIP</h3>
                <p>Снаряжение, которое не подведет</p>
            </div>
            <div class="footer-col">
                <p>Email: hello@equip-shop.ru</p>
                <p>Телефон: +7 (999) 000-00-00</p>
                <p>Режим работы: Пн-Пт: 10:00 - 20:00</p>
            </div>
        </div>
        <div class="copyright">
            &copy; 2026 EQUIP. Все права защищены.
        </div>
    </footer>
</body>
</html>
